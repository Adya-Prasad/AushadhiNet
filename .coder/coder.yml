version: "1.0"

# Project Information
name: "aushadhinet-gatv2"
description: "Drug-Drug Interaction Prediction using Graph Neural Networks for Cardiovascular Disease"
icon: "💊"

# Workspace Configuration
workspace:
  # Base image - Coder will use Ubuntu with Python
  image: "codercom/enterprise-base:ubuntu"
  
  # Commands to run when workspace starts
  startup_script: |
    #!/bin/bash
    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    echo "AushadhiNet-GATv2 Workspace Setup"
    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    echo ""
    echo "Installing Python dependencies..."
    pip install -r requirements.txt --quiet
    echo "✔ Dependencies installed"
    echo ""
    echo "━━━━━━━━━━━━━━━━━━━━"
    echo "✔ Setup Complete!"
    echo "━━━━━━━━━━━━━━━━━━━━"
# Ports to expose
ports:
  - name: "Streamlit App"
    port: 8501
    protocol: "http"
    visibility: "public"
  
  - name: "Jupyter Notebook"
    port: 8888
    protocol: "http"
    visibility: "public"

# Recommended resources
resources:
  cpu: 2
  memory: "4GB"
  disk: "10GB"
  

# Environment variables
env:
  # Streamlit configuration
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  
  # Python configuration
  PYTHONUNBUFFERED: "1"
  
  # Project info
  PROJECT_NAME: "AushadhiNet-GATv2"
  HACKATHON: "Hack4Health-Byte2Beat-2026"

# IDE configuration (optional)
ide:
  # Use VS Code in browser
  type: "vscode"
  
  # Extensions to install (optional)
  extensions:
    - "ms-python.python"
    - "ms-toolsai.jupyter"
    - "streetsidesoftware.code-spell-checker"

# Git configuration (optional)
git:
  # Auto-fetch on workspace start
  auto_fetch: true
